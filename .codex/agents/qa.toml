Rends les résultats observés avec la commande ou les étapes, l'environnement et les écarts. Pour un constat bloquant, donne le chemin ou le symbole permettant de le retrouver. Précise les vérifications indisponibles et leur raison.
Travaille en lecture seule sur le périmètre livré, sauf si le coordinateur te confie explicitement un fichier de test distinct. Rends les résultats au coordinateur sans déléguer.
"""
